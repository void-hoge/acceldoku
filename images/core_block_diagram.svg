<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="625" viewBox="0 95 1280 625">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#202020"/></marker>
    <style>
      text { font-family: Arial, 'Noto Sans', sans-serif; fill: #161616; font-size: 15px; text-anchor: middle }
      .title { font-size: 18px; font-weight: bold } .small { font-size: 13px }
      .box { fill: white; stroke: #202020; stroke-width: 1.5 }
      .wire { fill: none; stroke: #202020; stroke-width: 1.5; marker-end: url(#arrow) }
      .control { fill: none; stroke: #555; stroke-width: 1.3; stroke-dasharray: 6 4; marker-end: url(#arrow) }
    </style>
  </defs>
  <rect width="1280" height="720" fill="white"/>
  <rect x="150" y="115" width="990" height="535" class="box"/>
  <text x="645" y="142" class="title">acceldoku_core / Solver core</text>

  <rect x="595" y="170" width="175" height="70" class="box"/>
  <text x="682.5" y="199">Search control</text>
  <text x="682.5" y="219" class="small">IDLE / RUN / BRANCH / POP</text>
  <path d="M 972.5 305 V 270 H 745 V 240" class="control"/>
  <text x="860" y="261" class="small">solved / contradiction / change</text>
  <path d="M 610 240 V 270 H 265.5 V 305" class="control"/>
  <text x="438" y="261" class="small">push / pop / discard</text>
  <path d="M 682.5 240 V 305" class="control"/>
  <text x="693" y="289" class="small" style="text-anchor: start">load / update / branch</text>
  <path d="M 770 230 H 1118 V 542.5 H 1013.75 V 575" class="control"/>
  <text x="945" y="221" class="small">write result</text>

  <g transform="translate(0 90)">

  <text x="77" y="217">From dispatcher</text>
  <text x="77" y="236" class="small">729-bit candidates</text>
  <path d="M 25 250 H 250" class="wire"/>

  <text x="327.5" y="203">State deque</text>
  <rect x="250" y="215" width="155" height="70" class="box"/>
  <path d="M 281 215 V 285 M 312 215 V 285 M 343 215 V 285 M 374 215 V 285" fill="none" stroke="#202020" stroke-width="1.5"/>
  <text x="453" y="203">Head cache</text>
  <rect x="437.5" y="215" width="31" height="70" class="box"/>
  <rect x="605" y="215" width="155" height="70" class="box"/>
  <text x="682.5" y="245">Current state</text>
  <text x="682.5" y="265" class="small">729-bit candidates</text>
  <rect x="890" y="215" width="165" height="70" class="box"/>
  <text x="972.5" y="245">Deduction engine</text>
  <text x="972.5" y="265" class="small">singles / locked candidates</text>
  <path d="M 405 250 H 437.5" class="wire"/>
  <path d="M 468.5 250 H 605" class="wire"/>
  <path d="M 760 232 H 890" class="wire"/>
  <path d="M 890 268 H 760" class="wire"/>
  <path d="M 813 263 C 795 262 783 257 783 250 C 783 232 867 232 867 250 C 867 257 855 262 837 263" class="wire"/>
  <text x="825" y="248" style="font-size: 9px">1 application</text>
  <text x="825" y="258" style="font-size: 9px">/ cycle</text>
  <text x="825" y="221" class="small">candidates</text>
  <text x="825" y="288" class="small">next candidates</text>

  <rect x="890" y="350" width="165" height="70" class="box"/>
  <text x="972.5" y="380">Branch generator</text>
  <text x="972.5" y="400" class="small">candidate split</text>
  <path d="M 722.5 285 V 317.5 H 972.5 V 350" class="wire"/>
  <text x="850" y="309" class="small">stalled state</text>
  <path d="M 890 370 H 682.5 V 285" class="wire"/>
  <text x="790" y="362" class="small">branch A: explore</text>
  <path d="M 890 400 H 389.5 V 285" class="wire"/>
  <path d="M 453 400 V 285" class="wire"/>
  <circle cx="453" cy="400" r="3" fill="#202020"/>
  <text x="525" y="392" class="small">branch B: push at front</text>

  <rect x="890" y="485" width="165" height="50" class="box"/>
  <text x="972.5" y="507">Result register</text>
  <text x="972.5" y="526" class="small">candidates / solved</text>
  <path d="M 642.5 285 V 452.5 H 931.25 V 485" class="wire"/>
  <text x="790" y="444" class="small">solution</text>
  <path d="M 1055 510 H 1245" class="wire"/>
  <text x="1190" y="478">To collector</text>
  <text x="1190" y="497" class="small">result</text>
  </g>

  <line x1="410" y1="688" x2="460" y2="688" class="wire"/><text x="528" y="693" class="small">candidate data</text>
  <line x1="670" y1="688" x2="720" y2="688" class="control"/><text x="785" y="693" class="small">control / status</text>
</svg>
