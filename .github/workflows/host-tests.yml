name: Host tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build python3 iverilog verilator yosys
      - name: Configure
        run: cmake --preset host -DACCELDOKU_CORES=6
      - name: Build
        run: cmake --build --preset host --parallel 2
      - name: Test
        run: ctest --preset host
